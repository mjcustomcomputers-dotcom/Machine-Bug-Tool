name: FrontierOR five-level parity inversion diagnostic
on:
  push:
    branches: [frontieror-crew-five-level-parity-20261010]
    paths:
      - '.github/workflows/frontieror-five-level-parity.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_five_level_parity.py'
      - 'frontieror/tests/bench_crew_five_level_parity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match preinstalled numerical and constraint solver packages
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755'
      - name: Five-level metamorphic and inverted-oracle tests
        run: python -m unittest discover -s frontieror/tests -p test_crew_five_level_parity.py -v
      - name: Measure 240 and 480 row parity effects on feasibility
        run: python -u frontieror/tests/bench_crew_five_level_parity.py
      - name: Retain diagnosis only
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-gf2-fault-matrix
          path: frontieror/artifacts/crew-five-level-parity.json
          retention-days: 14
