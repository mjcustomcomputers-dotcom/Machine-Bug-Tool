name: Crew inline sonar method/classifier interchange
on:
  push:
    branches: [frontieror-sonar-feedback-dynamic-parity-20261010]
    paths:
      - '.github/workflows/frontieror-sonar-inline.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_sonar_feedback.py'
      - 'frontieror/tests/bench_crew_sonar_inline.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrow solver dependencies
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755'
      - name: Verify independent oracle and fused source classifications
        run: python -m unittest discover -s frontieror/tests -p test_crew_sonar_feedback.py -v
      - name: Benchmark six source-controlled method/classifier interchanges
        run: python -u frontieror/tests/bench_crew_sonar_inline.py
      - name: Retain original-model results only
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-inline-sonar-result
          path: frontieror/artifacts/crew-inline-sonar-ab.json
          retention-days: 14
