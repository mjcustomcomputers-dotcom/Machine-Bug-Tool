name: FrontierOR Crew safeguarded fallback reserve
on:
  push:
    branches: [frontieror-crew-fallback-reserve-20261010]
    paths:
      - '.github/workflows/frontieror-crew-fallback-reserve.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_sentinel_dispatch.py'
      - 'frontieror/tests/bench_crew_sentinel_dispatch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned solver dependencies
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755'
      - name: Verify exact full solve contract and original truth
        run: python -m unittest discover -s frontieror/tests -p test_crew_sentinel_dispatch.py -v
      - name: Compare full controller with original fallback
        run: python -u frontieror/tests/bench_crew_sentinel_dispatch.py
      - name: Retain research measurements only
        uses: actions/upload-artifact@v4
        with:
          name: crew-fallback-reserve-e2e
          path: frontieror/artifacts/crew-fallback-reserve-e2e.json
          retention-days: 14
