name: FrontierOR Crew conservation microdiagnostic
on:
  push:
    branches: [frontieror-crew-conservation-recon-20261010]
    paths:
      - '.github/workflows/frontieror-crew-conservation-diagnostic.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_conservation.py'
      - 'frontieror/tests/bench_crew_conservation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrow solver dependency only
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1'
      - name: Try to falsify row-potential conservation
        run: python -m unittest discover -s frontieror/tests -p test_crew_conservation.py -v
      - name: Run focused equivalent-objective runtime A/B
        run: python frontieror/tests/bench_crew_conservation.py
      - name: Preserve fault data and timings (not competition packaging)
        uses: actions/upload-artifact@v4
        with:
          name: crew-conservation-diagnostic
          path: frontieror/artifacts/crew-conservation-benchmark.json
          retention-days: 14
