name: FrontierOR DARP isolated solver check
on:
  push:
    branches: [frontieror-darp-testing-20261010]
    paths:
      - 'frontieror/solvers/cordeau2006/solve.py'
      - 'frontieror/tests/**'
      - '.github/workflows/frontieror-darp-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-darp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install exact optimization library
        run: python -m pip install 'ortools==9.15.6755'
      - name: Run solver and independent feasibility tests
        run: python -m unittest discover -s frontieror/tests -v
