name: FrontierOR direct single-ZIP download
on:
  push:
    branches: [frontieror-darp-testing-20261010]
    paths:
      - '.github/workflows/frontieror-direct-download.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-direct-zip:
    if: github.ref == 'refs/heads/frontieror-darp-testing-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build exactly six audited Python solver files
        run: python frontieror/build_submission.py
      - name: Verify all six solver bytes against the passing 28-test build
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,zipfile
          expected={
            "barnhart2000":"dfab79c072579da5f433643819764f4c8d95a97c5d53ff8524b457117df48f0f",
            "bodur2017":"31882b9e0316af95fdb1f8b9a0adcb3c251d656c7bbae1ed454a5f8bf2b85c62",
            "cordeau2006":"5abd27e464e6e2b6de672f295aabaa27809c35be85e48a097ba4982c1ff4e962",
            "fischetti1998":"7f808c4f9e55d9185b865b5bc3d32fe2466b86a1f92f526db9d22e779cfe765e",
            "hoffman1993":"e22d695919a9c7f9556f4bc1f7ed2e2f0318c5418eaf2e2544af2b912351dfc2",
            "nagy2015":"5fe3d646984f97442cbe9f1504682a65ca078c8a39306d457009945492717ec0",
          }
          with zipfile.ZipFile("frontieror/artifacts/FrontierOR-Main.zip") as archive:
            assert set(archive.namelist())=={f"{slug}/solve.py" for slug in expected}
            for slug,digest in expected.items():
              actual=hashlib.sha256(archive.read(f"{slug}/solve.py")).hexdigest()
              if actual!=digest:
                raise SystemExit(f"STOP: {slug} differs from last passing tested code")
          print("PASS: six exact source files match successful 28-test run")
          PY
      - name: Publish only the verified submission ZIP to this competition branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontieror/downloads
          cp frontieror/artifacts/FrontierOR-Main.zip frontieror/downloads/FrontierOR-Main-Upload-This.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontieror/downloads/FrontierOR-Main-Upload-This.zip
          if git diff --cached --quiet; then
            echo "Verified competition ZIP already published."
          else
            git commit -m "Publish verified six-solver FrontierOR Main ZIP for direct download"
            git push origin HEAD:refs/heads/frontieror-darp-testing-20261010
          fi
