name: FrontierOR Main Crew residual and side-bound stress verification
on:
  push:
    branches: [frontieror-crew-reverse-window-20261010]
    paths:
      - 'frontieror/solvers/hoffman1993/**'
      - 'frontieror/tests/test_crew_reverse.py'
      - '.github/workflows/frontieror-crew-reverse-window.yml'
      - 'frontieror/hardening/**'
      - 'frontieror/build_submission.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match organizer solver libraries
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755' 'highspy==1.15.1' 'networkx==3.7'
      - name: Independent exact-cover, original objective and controlled inversion tests
        run: python -m unittest discover -s frontieror/tests -v
      - name: Preserve all six synthetic objective comparators
        run: python frontieror/benchmark.py
      - name: Run 2 CPU 4 GB offline read-only solver sandbox
        run: |
          docker info >/dev/null
          docker build -f frontieror/hardening/Dockerfile --build-arg PY_VERSION=3.12 -t frontieror-main:3.12 .
          python frontieror/hardening/sandbox_probe.py --image frontieror-main:3.12 --seconds 22 --out frontieror/artifacts/resource-probe.json
      - name: Run 15000-row 100-side-constraint Crew stress in the same restricted sandbox
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"frontieror/tests")
          sys.path.insert(0,"frontieror/hardening")
          from test_crew_reverse import large_case
          from sandbox_probe import one
          receipt=one("frontieror-main:3.12","hoffman1993","large-residual-15000-100",
                      large_case(),22)
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Build official-format archive with source-byte checks
        run: python frontieror/build_submission.py
      - name: Publish only when all independent Crew stress and full-six gates pass
        shell: bash
        run: |
          set -euo pipefail
          cp frontieror/artifacts/FrontierOR-Main.zip frontieror/downloads/FrontierOR-Main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontieror/downloads/FrontierOR-Main.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete verified FrontierOR Main archive"
            git push origin HEAD:refs/heads/frontieror-crew-reverse-window-20261010
          fi
      - name: Save exact six-solver archive and independent resource receipts
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-main-crew-verified
          path: |
            frontieror/artifacts/FrontierOR-Main.zip
            frontieror/artifacts/manifest.json
            frontieror/artifacts/benchmark.json
            frontieror/artifacts/resource-probe.json
          retention-days: 14
