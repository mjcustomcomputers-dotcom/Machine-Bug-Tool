name: FrontierOR Main Python 3.12 objective and resource verification
on:
  push:
    branches: [frontieror-objective-core-20261010]
    paths:
      - '.github/workflows/frontieror-objective-core.yml'
      - 'frontieror/solvers/**'
      - 'frontieror/tests/**'
      - 'frontieror/hardening/**'
      - 'frontieror/build_submission.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match organizer preinstalled solver versions
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755' 'highspy==1.15.1' 'networkx==3.7'
      - name: Verify matching objectives, cost witnesses, streaming callbacks and 6 solvers
        run: python -m unittest discover -s frontieror/tests -v
      - name: Run independent six-problem objective comparison
        run: python frontieror/benchmark.py
      - name: Verify 2 CPU, 4 GB, read-only solver, offline 12-case sandbox
        run: |
          docker info >/dev/null
          docker build -f frontieror/hardening/Dockerfile --build-arg PY_VERSION=3.12 -t frontieror-main:3.12 .
          python frontieror/hardening/sandbox_probe.py --image frontieror-main:3.12 --seconds 22 --out frontieror/artifacts/resource-probe.json
      - name: Build exact official folder format and source-hash readback
        run: python frontieror/build_submission.py
      - name: Publish standard submission ZIP only after every previous gate passed
        shell: bash
        run: |
          set -euo pipefail
          cp frontieror/artifacts/FrontierOR-Main.zip frontieror/downloads/FrontierOR-Main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontieror/downloads/FrontierOR-Main.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified FrontierOR Main solver archive"
            git push origin HEAD:refs/heads/frontieror-objective-core-20261010
          fi
      - name: Preserve exact ZIP, checksums and objective/resource comparisons
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-main-verified
          path: |
            frontieror/artifacts/FrontierOR-Main.zip
            frontieror/artifacts/manifest.json
            frontieror/artifacts/benchmark.json
            frontieror/artifacts/resource-probe.json
          retention-days: 14
