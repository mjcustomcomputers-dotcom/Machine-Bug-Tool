name: Crew pulse-filter holdout original-verifier diagnostic
on:
  push:
    branches: [frontieror-crew-pulse-reconstruction-20261010]
    paths:
      - '.github/workflows/frontieror-lp-pulse-filter.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_lp_adaptive_filter.py'
      - 'frontieror/tests/bench_crew_lp_adaptive_filter.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only numerical and CP packages
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755'
      - name: Inverted acoustic-echo filter truth oracles
        run: python -m unittest discover -s frontieror/tests -p test_crew_lp_adaptive_filter.py -v
      - name: Run independent source-tied six-seed score-floor comparison
        run: python -u frontieror/tests/bench_crew_lp_adaptive_filter.py
      - name: Retain only diagnostic JSON without release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crew-pulse-filter-holdout
          path: frontieror/artifacts/crew-lp-pulse-filter-ab.json
          retention-days: 14
