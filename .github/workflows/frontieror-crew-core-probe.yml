name: FrontierOR Crew source-bound core-probe diagnostic
on:
  push:
    branches: [frontieror-crew-unsat-core-sonar-20261010]
    paths:
      - '.github/workflows/frontieror-crew-core-probe.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_core_probe.py'
      - 'frontieror/tests/bench_crew_core_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-choices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned packages
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755'
      - name: Test local contradiction release and original truth
        run: python -m unittest discover -s frontieror/tests -p test_crew_core_probe.py -v
      - name: Compare known hard cases with matched budgets
        run: python -u frontieror/tests/bench_crew_core_probe.py
      - name: Retain only diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: crew-core-probe-research
          path: frontieror/artifacts/crew-core-probe-ab.json
          retention-days: 14
