name: FrontierOR Crew proof-aware dual engine A/B
on:
  push:
    branches: [frontieror-crew-dual-proof-exit-20261010]
    paths:
      - '.github/workflows/frontieror-crew-dual-proof-exit.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_dual_portfolio.py'
      - 'frontieror/tests/bench_crew_dual_portfolio.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-aware-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned solvers
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755'
      - name: Verify independent truth and adverse assumptions
        run: python -m unittest discover -s frontieror/tests -p test_crew_dual_portfolio.py -v
      - name: Benchmark proof-aware full solver
        run: python -u frontieror/tests/bench_crew_dual_portfolio.py
      - name: Archive research data, no submission
        uses: actions/upload-artifact@v4
        with:
          name: crew-dual-proof-exit
          path: frontieror/artifacts/crew-dual-proof-exit-ab.json
          retention-days: 14
