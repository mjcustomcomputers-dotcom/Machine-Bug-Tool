name: FrontierOR score recovery validation
on:
  push:
    branches: [frontieror-score-recovery-20261010]
    paths:
      - 'frontieror/**'
      - '!frontieror/downloads/**'
      - '.github/workflows/frontieror-score-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install organizer's open-source scientific dependencies
        run: python -m pip install 'ortools==9.15.6755' 'scipy==1.18.1'
      - name: Run independent solver validators, including positive-arc-cost oracle
        run: python -m unittest discover -s frontieror/tests -v
      - name: Produce submission ZIP and exact source hash manifest
        run: python frontieror/build_submission.py
      - name: Publish validated ZIP for review without submitting
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-score-recovery-py${{ matrix.python }}
          path: frontieror/artifacts/*
          if-no-files-found: error
          retention-days: 14

  constrained-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build resource-limited execution environment
        run: |
          docker build -f frontieror/hardening/Dockerfile --build-arg PY_VERSION=${{ matrix.python }} -t frontieror-recovery:${{ matrix.python }} .
      - name: Test six CLI solvers with 2 vCPU 4 GB no network read-only source
        run: |
          python frontieror/hardening/sandbox_probe.py --image frontieror-recovery:${{ matrix.python }} --seconds 22 --out frontieror/artifacts/recovery-probe-py${{ matrix.python }}.json
      - name: Save machine-verifiable resource report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-recovery-resource-py${{ matrix.python }}
          path: frontieror/artifacts/recovery-probe-py${{ matrix.python }}.json
          if-no-files-found: warn
          retention-days: 14

  publish-reviewed-zip:
    needs: [python-compatibility, constrained-sandbox]
    if: github.ref == 'refs/heads/frontieror-score-recovery-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Rebuild six-file ZIP from successful validation commit
        run: python frontieror/build_submission.py
      - name: Check only permitted slug entries and authenticated hash manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          folder=Path('frontieror')
          manifest=json.loads((folder/'artifacts/manifest.json').read_text())
          archive=folder/'artifacts/FrontierOR-Main.zip'
          expected={row['slug']+'/solve.py':row['sha256'] for row in manifest['sources']}
          assert len(expected)==6
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())==set(expected)
              for filename,sha in expected.items():
                  assert hashlib.sha256(z.read(filename)).hexdigest()==sha
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==manifest['zip_sha256']
          print('PASS: six exact source identities and archive hash verified')
          PY
      - name: Publish a direct ZIP after the tests and sandbox both pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontieror/downloads
          cp frontieror/artifacts/FrontierOR-Main.zip frontieror/downloads/FrontierOR-Main-Score-Recovery-Upload-This.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f frontieror/downloads/FrontierOR-Main-Score-Recovery-Upload-This.zip
          if git diff --cached --quiet; then
            echo 'Exact upload ZIP already published'
          else
            git commit -m 'Publish tested FrontierOR recovery ZIP after all gates'
            git push origin HEAD:refs/heads/frontieror-score-recovery-20261010
          fi
