name: FrontierOR Crew side-activity exact-reduction verification
on:
  push:
    branches: [frontieror-crew-side-activity-20261010]
    paths:
      - '.github/workflows/frontieror-crew-side-activity.yml'
      - 'frontieror/solvers/**'
      - 'frontieror/tests/**'
      - 'frontieror/build_submission.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  objective-and-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match organizer installed solver packages
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755' 'highspy==1.15.1' 'networkx==3.7'
      - name: Run all original and structural tests
        run: python -m unittest discover -s frontieror/tests -v
      - name: Compare all six objective benchmarks
        run: python frontieror/benchmark.py
      - name: Measure literal versus projected Crew objective and time (ABBA)
        run: python frontieror/tests/bench_crew_side_activity.py
      - name: Verify read-only 2-vCPU 4-GB offline runtime
        run: |
          docker build -f frontieror/hardening/Dockerfile --build-arg PY_VERSION=3.12 -t frontieror-side:3.12 .
          python frontieror/hardening/sandbox_probe.py --image frontieror-side:3.12 --seconds 22 --out frontieror/artifacts/side-resource-probe.json
      - name: Build exact twelve-file submission and independently read back source
        run: python frontieror/build_submission.py
      - name: Publish isolated candidate only after passing all gates
        shell: bash
        run: |
          set -euo pipefail
          cp frontieror/artifacts/FrontierOR-Main.zip frontieror/downloads/FrontierOR-Main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontieror/downloads/FrontierOR-Main.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish side-activity verified six-solver archive"
            git push origin HEAD:refs/heads/frontieror-crew-side-activity-20261010
          fi
      - name: Preserve objective benchmark and hash receipts
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-side-activity-candidate
          path: |
            frontieror/artifacts/FrontierOR-Main.zip
            frontieror/artifacts/manifest.json
            frontieror/artifacts/benchmark.json
            frontieror/artifacts/side-resource-probe.json
            frontieror/artifacts/side-activity-benchmark.json
          retention-days: 14
