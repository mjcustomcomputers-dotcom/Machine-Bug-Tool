name: Crew sonar dynamic parity feedback microdiagnostic
on:
  push:
    branches: [frontieror-sonar-feedback-dynamic-parity-20261010]
    paths:
      - '.github/workflows/frontieror-sonar-feedback.yml'
      - 'frontieror/solvers/hoffman1993/solve.py'
      - 'frontieror/tests/test_crew_sonar_feedback.py'
      - 'frontieror/tests/bench_crew_sonar_feedback.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and CP search dependencies
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755'
      - name: Verify coupled parity + mutation + sonar echo controls
        run: python -m unittest discover -s frontieror/tests -p test_crew_sonar_feedback.py -v
      - name: A/B paired route comparison within identical deadlines
        run: python -u frontieror/tests/bench_crew_sonar_feedback.py
      - name: Retain short source-bound evidence only
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-sonar-feedback-ab
          path: frontieror/artifacts/crew-sonar-feedback-ab.json
          retention-days: 14
