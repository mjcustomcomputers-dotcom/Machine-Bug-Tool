name: FrontierOR Crew fractional-side rescue validation
on:
  push:
    branches: [frontieror-johnny5-fractional-rescue-20261010]
    paths:
      - 'frontieror/solvers/hoffman1993/**'
      - 'frontieror/tests/test_crew.py'
      - '.github/workflows/frontieror-johnny5-rescue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fractional-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match organizer installed dependencies
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755' 'highspy==1.15.1' 'networkx==3.7'
      - name: Crew original-objective and fractional feasibility regressions
        run: python -m unittest discover -s frontieror/tests -p test_crew.py -v
      - name: Cross-check objective controls and solver callback
        run: python -m unittest discover -s frontieror/tests -p test_objective_controls.py -v
      - name: Run all six solver regression checks
        run: python -m unittest discover -s frontieror/tests -v
      - name: Compare objective values across all six solvers
        run: python frontieror/benchmark.py
      - name: Verify constrained offline sandbox
        run: |
          docker build -f frontieror/hardening/Dockerfile --build-arg PY_VERSION=3.12 -t frontieror-main-johnny5:3.12 .
          python frontieror/hardening/sandbox_probe.py --image frontieror-main-johnny5:3.12 --seconds 22 --out frontieror/artifacts/johnny5-resource-probe.json
      - name: Build twelve-file competition ZIP with source hash readback
        run: python frontieror/build_submission.py
      - name: Publish isolated candidate ZIP after the objective gates
        shell: bash
        run: |
          set -euo pipefail
          cp frontieror/artifacts/FrontierOR-Main.zip frontieror/downloads/FrontierOR-Main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontieror/downloads/FrontierOR-Main.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified isolated FrontierOR Main candidate archive"
            git push origin HEAD:refs/heads/frontieror-johnny5-fractional-rescue-20261010
          fi
      - name: Retain candidate ZIP, exact hashes and objective results
        uses: actions/upload-artifact@v4
        with:
          name: frontieror-johnny5-candidate
          path: |
            frontieror/artifacts/FrontierOR-Main.zip
            frontieror/artifacts/manifest.json
            frontieror/artifacts/benchmark.json
            frontieror/artifacts/johnny5-resource-probe.json
          retention-days: 14
