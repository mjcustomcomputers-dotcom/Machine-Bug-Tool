name: FrontierOR Crew fractional-side rescue validation
on:
  push:
    branches: [frontieror-johnny5-fractional-rescue-20261010]
    paths:
      - 'frontieror/solvers/hoffman1993/**'
      - 'frontieror/tests/test_crew.py'
      - '.github/workflows/frontieror-johnny5-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fractional-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match organizer installed dependencies
        run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'ortools==9.15.6755' 'highspy==1.15.1' 'networkx==3.7'
      - name: Crew original-objective and fractional feasibility regressions
        run: python -m unittest discover -s frontieror/tests -p test_crew.py -v
      - name: Cross-check objective controls and solver callback
        run: python -m unittest discover -s frontieror/tests -p test_objective_controls.py -v
